<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"></meta>
<meta name="viewport" content="width=device-width, initial-scale=1.0"></meta>
<title>LeoCards — Daybreak Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"></link>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"></link>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&amp;family=Figtree:wght@400;600;700&amp;family=Albert+Sans:wght@400;600&amp;display=swap" rel="stylesheet"></link>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  #root { height: 100vh; }
  @keyframes lc-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="hifi-shared.jsx"></script>
<script type="text/babel" src="hifi-daybreak.jsx"></script>
<script type="text/babel" src="daybreak-dashboard.jsx"></script>
<script type="text/babel">
  function App() {
    return (
      <DesignCanvas>
        <DCSection id="dash" title="Dashboard (“My Deck”) — Daybreak hi-fi" subtitle="The locked wireframe brought into Daybreak: large Habitat hero (lion on a sunrise disc, conic progress ring + level badge), Option D action line (Start studying + shared status / Add a card), and “Your words” as a tap-to-expand inline accordion. Deck picker is a small top-right icon.">
          <DCArtboard id="hi-due" label="1 · Active, cards due" width={390} height={844}><DbDue /></DCArtboard>
          <DCArtboard id="hi-none" label="2 · None due (0 due)" width={390} height={844}><DbNone /></DCArtboard>
          <DCArtboard id="hi-resting" label="3 · Resting" width={390} height={844}><DbResting /></DCArtboard>
          <DCArtboard id="hi-paused" label="4 · All paused" width={390} height={844}><DbPaused /></DCArtboard>
          <DCArtboard id="hi-wordsopen" label="5 · Words accordion open" width={390} height={844}><DbWordsOpen /></DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
