<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"></meta>
<meta name="viewport" content="width=device-width, initial-scale=1.0"></meta>
<title>LeoCards — Habitat Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"></link>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"></link>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&amp;family=Caveat:wght@400;600&amp;display=swap" rel="stylesheet"></link>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  #root { height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="wf-shared.jsx"></script>
<script type="text/babel" src="wf-habitat.jsx"></script>
<script type="text/babel" src="wf-habitat-boards.jsx"></script>
<script type="text/babel">
  function App() {
    return (
      <DesignCanvas>
        <DCSection id="arc" title="Habitat — the growth arc" subtitle="The world is a direct mirror of the learning habit: it starts sparse and fills in level by level. Leo stays a flat-geometric lion. Mood (here mostly happy/excited) is independent of level and reads from his expression + ambient cues + a small label. Shown at three points on the arc.">
          <DCArtboard id="hab-new" label="New user · Level 1" width={556} height={760}><HabNew /></DCArtboard>
          <DCArtboard id="hab-mid" label="Mid · Level 5 (default)" width={556} height={760}><HabMid /></DCArtboard>
          <DCArtboard id="hab-lush" label="Lush · Level 9 (endgame)" width={556} height={760}><HabLush /></DCArtboard>
        </DCSection>
        <DCSection id="prog" title="Habitat — progress & next-unlock (3 options)" subtitle="The full page has room to make next-level anticipation richer than the dashboard widget. Three ways to show how close you are and what's coming — same scene (L5), different treatment. Pick one for hi-fi.">
          <DCArtboard id="prog-card" label="Option 1 · Bottom card" width={556} height={760}><HabProgOptCard /></DCArtboard>
          <DCArtboard id="prog-ring" label="Option 2 · Ring + peek" width={556} height={760}><HabProgOptRing /></DCArtboard>
          <DCArtboard id="prog-min" label="Option 3 · Minimal sliver" width={556} height={760}><HabProgOptMinimal /></DCArtboard>
        </DCSection>
        <DCSection id="states" title="Habitat — emotional & system states" subtitle="The mood/health side of the mirror plus graceful degradation. Decay is encouraging, not punishing; offline and error never show a blank or broken screen; reduced-motion gets a calm static version.">
          <DCArtboard id="st-celebrate" label="Level-up celebration" width={556} height={760}><HabCelebrate /></DCArtboard>
          <DCArtboard id="st-decay" label="Decaying / sad" width={556} height={760}><HabDecay /></DCArtboard>
          <DCArtboard id="st-offline" label="Offline (cached)" width={556} height={760}><HabOffline /></DCArtboard>
          <DCArtboard id="st-error" label="Error (no data)" width={556} height={760}><HabError /></DCArtboard>
          <DCArtboard id="st-reduced" label="Reduced motion" width={556} height={760}><HabReduced /></DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
