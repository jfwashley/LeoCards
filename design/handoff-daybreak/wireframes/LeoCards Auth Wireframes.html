<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"></meta>
<meta name="viewport" content="width=device-width, initial-scale=1.0"></meta>
<title>LeoCards — Auth Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"></link>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"></link>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&amp;family=Caveat:wght@400;600&amp;display=swap" rel="stylesheet"></link>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  #root { height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="wf-shared.jsx"></script>
<script type="text/babel" src="wf-auth.jsx"></script>
<script type="text/babel" src="wf-auth-boards.jsx"></script>
<script type="text/babel">
  function App() {
    return (
      <DesignCanvas>
        <DCSection id="signup" title="Signup — “Create your account”" subtitle="The account-creation counterpart to Login, in the locked shell A (habitat scene atop every card, recoloured per screen). Account basics only — name, email, password; choosing native + target language happens next on its own dedicated page. Inline per-field validation, a single primary, and a cross-link to sign in.">
          <DCArtboard id="su-default" label="1 · Default / empty" width={596} height={812}><SignupDefault /></DCArtboard>
          <DCArtboard id="su-errors" label="2 · Per-field validation" width={596} height={812}><SignupErrors /></DCArtboard>
          <DCArtboard id="su-taken" label="3 · Email already in use" width={596} height={812}><SignupTaken /></DCArtboard>
          <DCArtboard id="su-submitting" label="4 · Submitting" width={596} height={812}><SignupSubmitting /></DCArtboard>
        </DCSection>
        <DCSection id="forgot" title="Forgot password — “Reset your password”" subtitle="Requests a reset link by email. The confirmation is privacy-safe — it shows for any address (“if it exists, it's on its way”) rather than revealing whether an account exists — and is warm rather than terse.">
          <DCArtboard id="fp-default" label="1 · Default" width={596} height={812}><ForgotDefault /></DCArtboard>
          <DCArtboard id="fp-invalid" label="2 · Invalid email" width={596} height={812}><ForgotInvalid /></DCArtboard>
          <DCArtboard id="fp-submitting" label="3 · Submitting" width={596} height={812}><ForgotSubmitting /></DCArtboard>
          <DCArtboard id="fp-sent" label="4 · Sent confirmation" width={596} height={812}><ForgotSent /></DCArtboard>
        </DCSection>
        <DCSection id="reset" title="Reset password — “Set a new password”" subtitle="Reached from the emailed link. New password + confirm, with “passwords do not match” inline against the confirm field. Includes the dead-end recovery state for an expired/used link — a common real path that must never trap the user.">
          <DCArtboard id="rp-default" label="1 · Default" width={596} height={812}><ResetDefault /></DCArtboard>
          <DCArtboard id="rp-mismatch" label="2 · Passwords don't match" width={596} height={812}><ResetMismatch /></DCArtboard>
          <DCArtboard id="rp-submitting" label="3 · Submitting" width={596} height={812}><ResetSubmitting /></DCArtboard>
          <DCArtboard id="rp-expired" label="4 · Expired / invalid link" width={596} height={812}><ResetExpired /></DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
