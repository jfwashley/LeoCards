<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"></meta>
<meta name="viewport" content="width=device-width, initial-scale=1.0"></meta>
<title>LeoCards — Dashboard Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"></link>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"></link>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&amp;family=Caveat:wght@400;600&amp;display=swap" rel="stylesheet"></link>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  #root { height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="wf-shared.jsx"></script>
<script type="text/babel" src="wf-dashboard.jsx"></script>
<script type="text/babel">
  function App() {
    return (
      <DesignCanvas>
        <DCSection id="dash-core" title="Dashboard (“My Deck”) — Option D + inline accordion" subtitle="Locked direction: large Habitat hero, Option D action line, and “Your words” as a tap-to-expand inline accordion (Option 1) — no swipe, so no conflict with the OS app-switch gesture. Shown across the four states plus the accordion open.">
          <DCArtboard id="wf-due" label="1 · Active, cards due" width={596} height={788}><DashDue /></DCArtboard>
          <DCArtboard id="wf-none" label="2 · None due (0 due)" width={596} height={788}><DashNone /></DCArtboard>
          <DCArtboard id="wf-resting" label="3 · Resting" width={596} height={788}><DashResting /></DCArtboard>
          <DCArtboard id="wf-paused" label="4 · All paused" width={596} height={788}><DashPaused /></DCArtboard>
          <DCArtboard id="wf-wordsopen" label="5 · Words accordion open" width={596} height={788}><DashWordsOpen /></DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
