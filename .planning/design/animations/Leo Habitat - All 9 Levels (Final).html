<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Leo Cards · Habitat Levels</title>
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  #root { height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="habitats-shared.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="habitat-clay-styles.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { createRoot } = ReactDOM;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "walkSpeed": 1.5,
  "lakeScale": 1.3,
  "napDemo": false
}/*EDITMODE-END*/;

const ALL_UNLOCKS = [
  { lv: 2, label: 'Lake' },
  { lv: 3, label: 'Trees' },
  { lv: 4, label: 'Plants' },
  { lv: 5, label: 'Elephant' },
  { lv: 6, label: 'Mushrooms' },
  { lv: 7, label: 'Cave' },
  { lv: 8, label: 'Toys' },
  { lv: 9, label: 'Songbirds' },
];

function LevelArtboard({ level, tweaks, companionMode, width = 1280, height = 800 }) {
  const upcoming = ALL_UNLOCKS.filter((u) => u.lv > level);
  const nextLv = upcoming[0]?.lv;
  return (
    <div style={{ position: 'relative', width, height }}>
      <ClayHabitatLevel width={width} height={height} level={level} tweaks={tweaks} companionMode={companionMode} />

      {/* Bottom-right unlock ladder. The next-up slot is highlighted in pink. */}
      <div style={{
        position: 'absolute', right: 18, bottom: 64,
        background: 'rgba(255,255,255,0.86)',
        backdropFilter: 'blur(8px)',
        borderRadius: 14,
        padding: '12px 14px',
        boxShadow: '0 4px 18px rgba(70,60,110,0.18)',
        color: '#4a4070',
        fontSize: 11,
        maxWidth: 220,
      }}>
        <div style={{
          fontWeight: 700, letterSpacing: 0.6, textTransform: 'uppercase',
          fontSize: 9, opacity: 0.6, marginBottom: 8,
        }}>{upcoming.length ? 'Next unlocks' : 'All unlocked'}</div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
          {upcoming.map((u) => (
            <div key={u.lv} style={{
              display: 'flex', alignItems: 'center', gap: 8,
              opacity: u.lv === nextLv ? 1 : 0.42,
            }}>
              <span style={{
                width: 18, height: 18, borderRadius: 5,
                background: u.lv === nextLv ? '#e85a8a' : 'rgba(74,64,112,0.18)',
                color: u.lv === nextLv ? '#fff' : '#4a4070',
                display: 'grid', placeItems: 'center',
                fontSize: 9, fontWeight: 700,
                flexShrink: 0,
              }}>{u.lv === nextLv ? '🔓' : u.lv}</span>
              <span style={{ fontWeight: u.lv === nextLv ? 600 : 500 }}>{u.label}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  return (
    <>
      <DesignCanvas>
        <DCSection
          id="levels"
          title="Leo Cards · Habitat Levels"
          subtitle="9-stage progression. The habitat reveals itself as the user reviews more cards."
        >
          <DCArtboard id="level-1" label="Level 1 · A Quiet Start" width={1280} height={800}>
            <LevelArtboard level={1} tweaks={t} />
          </DCArtboard>
          <DCArtboard id="level-2" label="Level 2 · The Lake" width={1280} height={800}>
            <LevelArtboard level={2} tweaks={t} />
          </DCArtboard>
          <DCArtboard id="level-3" label="Level 3 · The Grove" width={1280} height={800}>
            <LevelArtboard level={3} tweaks={t} />
          </DCArtboard>
          <DCArtboard id="level-4" label="Level 4 · In Bloom" width={1280} height={800}>
            <LevelArtboard level={4} tweaks={t} />
          </DCArtboard>
          <DCArtboard id="level-5" label="Level 5 v1 · A Visitor (meadow)" width={1280} height={800}>
            <LevelArtboard level={5} tweaks={t} companionMode="meadow" />
          </DCArtboard>
          <DCArtboard id="level-5b" label="Level 5 v2 · Drinking at the Lake" width={1280} height={800}>
            <LevelArtboard level={5} tweaks={t} companionMode="lakeside" />
          </DCArtboard>
          <DCArtboard id="level-6" label="Level 6 · Toadstools" width={1280} height={800}>
            <LevelArtboard level={6} tweaks={t} />
          </DCArtboard>
          <DCArtboard id="level-7" label="Level 7 · Den & Dream" width={1280} height={800}>
            <LevelArtboard level={7} tweaks={t} />
          </DCArtboard>
          <DCArtboard id="level-8" label="Level 8 · Playtime" width={1280} height={800}>
            <LevelArtboard level={8} tweaks={t} />
          </DCArtboard>
          <DCArtboard id="level-9" label="Level 9 · Songbirds" width={1280} height={800}>
            <LevelArtboard level={9} tweaks={t} />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
      <TweaksPanel>
        <TweakSection label="Motion" />
        <TweakSlider
          label="Walk speed"
          value={t.walkSpeed}
          min={0.3} max={2.5} step={0.1} unit="×"
          onChange={(v) => setTweak('walkSpeed', v)}
        />
        <TweakSection label="World" />
        <TweakSlider
          label="Lake size"
          value={t.lakeScale}
          min={0.6} max={2.5} step={0.1} unit="×"
          onChange={(v) => setTweak('lakeScale', v)}
        />
        <TweakToggle
          label="Nap cycle demo (30s)"
          value={t.napDemo}
          onChange={(v) => setTweak('napDemo', v)}
        />
      </TweaksPanel>
    </>
  );
}

createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
