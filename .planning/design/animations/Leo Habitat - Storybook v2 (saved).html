<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Leo Cards · Storybook Habitat</title>
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  #root { height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="habitats-shared.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="habitat-clay-styles.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { createRoot } = ReactDOM;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "walkSpeed": 1.0,
  "pollen": true,
  "petals": true,
  "birds": true
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  return (
    <>
      <DesignCanvas>
        <DCSection
          id="storybook"
          title="Leo Cards · Storybook Habitat"
          subtitle="Soft-clay Storybook direction · Leo walks a loop on top of the dome · drag to orbit, idle = auto-rotate"
        >
          <DCArtboard id="storybook" label="Storybook · Leo + Elephant" width={1280} height={800}>
            <ClayStorybookV2 width={1280} height={800} tweaks={t} />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
      <TweaksPanel>
        <TweakSection label="Motion" />
        <TweakSlider
          label="Walk speed"
          value={t.walkSpeed}
          min={0.3} max={2.5} step={0.1} unit="×"
          onChange={(v) => setTweak('walkSpeed', v)}
        />
        <TweakSection label="Atmosphere" />
        <TweakToggle label="Birds overhead" value={t.birds} onChange={(v) => setTweak('birds', v)} />
        <TweakToggle label="Pollen motes" value={t.pollen} onChange={(v) => setTweak('pollen', v)} />
        <TweakToggle label="Falling petals" value={t.petals} onChange={(v) => setTweak('petals', v)} />
      </TweaksPanel>
    </>
  );
}

createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
